<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replay Feed — Run-at-Risk offline preview</title>
  <!--
    OFFLINE PREVIEW HARNESS — NOT part of the deployed site.

    Loads the REAL reviews.html markup and the REAL page scripts
    (assets/js/reviews.js + assets/js/reviews-feed.js) but replaces window.MLB
    with a stub that serves the SAME deterministic fixtures the automated test
    tools/replay-feed-render-test.mjs uses. No network request is made.

    Purpose: see the run-at-risk banner / badge / stat / filter tab and hear
    the alert chime without waiting for a live review. Every number
    on screen comes from the fixture payload below — nothing is generated.

    Serve the repo root over http and open /tools/run-risk-preview.html
  -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="page-reviews">
  <header class="topbar">
    <div class="brand">
      <span class="brand-ball">⚾</span>
      <span>MLB Live PBP</span>
      <span class="brand-sub">replay feed · OFFLINE PREVIEW (fixture data)</span>
    </div>
    <div class="feed-controls">
      <button id="sound-toggle-btn" class="btn btn-ghost">🔇 Sound Off</button>
      <button id="notify-toggle-btn" class="btn btn-ghost">⚪ Run Alerts Off</button>
      <button class="btn" onclick="ReplayFeed.playAlertSound()" title="Hear the raindrop chime — the same sound is used for new reviews and for run-at-risk reviews">▶ Play alert chime</button>
      <button id="refresh-btn" class="btn">Refresh</button>
      <span class="countdown" id="countdown"></span>
      <div class="live-pill"><span id="live-dot" class="live-dot"></span><span>LIVE</span></div>
    </div>
    <div id="date-label" class="date-label"></div>
    <input type="date" id="date-picker" hidden>
  </header>

  <div id="banner" class="banner"></div>

  <main class="reviews-main">
    <section id="active-strip" class="active-strip-wrap"></section>
    <section id="feed-stats" class="reviews-summary-bar"></section>
    <nav id="feed-tabs" class="tabs"></nav>
    <section id="feed-list" class="feed-list"></section>
    <div id="status-line" class="status-line"></div>
  </main>

  <script>
    /* --- Deterministic fixtures, identical to tools/replay-feed-render-test.mjs --- */
    const SCHEDULE_GAMES = [{
      gamePk: 823342, season: '2026', gameDate: '2026-08-19T16:35:00Z',
      status: { abstractGameState: 'Live', codedGameState: 'I', detailedState: 'In Progress', statusCode: 'I', abstractGameCode: 'L' },
      teams: {
        away: { team: { id: 116, name: 'Detroit Tigers', link: '/api/v1/teams/116' }, score: 3 },
        home: { team: { id: 134, name: 'Pittsburgh Pirates', link: '/api/v1/teams/134' }, score: 1 },
      },
      linescore: {
        currentInning: 6, currentInningOrdinal: '6th', inningState: 'Top', isTopInning: true,
        teams: { home: { runs: 1, hits: 4, errors: 0 }, away: { runs: 3, hits: 5, errors: 0 } },
      },
      review: { hasChallenges: false, away: { used: 0, remaining: 1 }, home: { used: 0, remaining: 1 } },
    }];

    const PBP = {
      allPlays: [
        {
          about: { atBatIndex: 15, startTime: '2026-08-19T17:05:00Z', endTime: '2026-08-19T17:07:00Z', inning: 2, halfInning: 'bottom', isComplete: true, hasReview: false },
          result: { description: 'Jared Triolo grounds out, third baseman Hao-Yu Lee to first baseman Spencer Torkelson.', event: 'Groundout' },
          matchup: { batter: { id: 668804, fullName: 'Bryan Reynolds' }, pitcher: { id: 695549, fullName: 'Jackson Jobe' } },
          playEvents: [
            { isPitch: true, startTime: '2026-08-19T17:06:00Z', details: { description: 'Ball', hasReview: true }, reviewDetails: { isOverturned: false, inProgress: false, reviewType: 'MJ', challengeTeamId: 116 } },
          ],
        },
        {
          about: { atBatIndex: 16, inning: 6, halfInning: 'top', isComplete: true },
          result: { description: 'Previous play.', awayScore: 2, homeScore: 1 },
          runners: [], playEvents: [],
        },
      ],
      currentPlay: {
        about: { atBatIndex: 17, startTime: '2026-08-19T18:30:00Z', inning: 6, halfInning: 'top', isComplete: false },
        result: { event: 'Single', eventType: 'single', awayScore: 3, homeScore: 1, description: 'Runner is safe at home. Play under review.' },
        matchup: { batter: { id: 668804, fullName: 'Bryan Reynolds' }, pitcher: { id: 695549, fullName: 'Jackson Jobe' } },
        reviewDetails: { inProgress: true, reviewType: 'MA', challengeTeamId: 134 },
        runners: [{
          movement: { start: '3B', end: 'score', isOut: false },
          details: { event: 'Single', eventType: 'single', isScoringEvent: true, playIndex: 2, runner: { id: 1, fullName: 'Test Runner' } },
        }],
        playEvents: [{ index: 2, isPitch: true, details: { description: 'In play, run(s)' } }],
      },
    };

    const TEAMS_DIR = {
      116: { id: 116, name: 'Detroit Tigers', teamName: 'Tigers', locationName: 'Detroit', abbreviation: 'DET' },
      134: { id: 134, name: 'Pittsburgh Pirates', teamName: 'Pirates', locationName: 'Pittsburgh', abbreviation: 'PIT' },
    };

    /* Stub the API layer BEFORE api.js would run — this harness never fetches. */
    window.MLB = {
      getSchedule: async () => SCHEDULE_GAMES,
      getTeams: async () => TEAMS_DIR,
      getPlayByPlay: async () => PBP,
      ordinal: (n) => {
        const ORD = ['th', 'st', 'nd', 'rd', 'th', 'th', 'th', 'th', 'th', 'th'];
        const n10 = n % 100;
        return `${n}${(n10 >= 11 && n10 <= 13) ? 'th' : ORD[n % 10] || 'th'}`;
      },
    };
  </script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/reviews.js"></script>
  <script src="../assets/js/reviews-feed.js"></script>
</body>
</html>
